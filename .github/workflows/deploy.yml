name: Deploy website via SFTP

on:
  push:
    branches:
      - main 

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📦 Prepare deploy folder
      run: |
        mkdir -p deploy
        cp dashboard/app.R deploy/
        cp -r dashboard/data deploy/
        cp -r dashboard/utils deploy/
        cp -r dashboard/templates deploy/

    - name: ⚙️ Load deployment config
      shell: bash
      run: |
        if [ -f dashboard/deploy.env ]; then
          . ./dashboard/deploy.env
        fi

        if [ -z "${APP_FOLDER:-}" ] || [ "$APP_FOLDER" = "NONE" ]; then
          echo "Set APP_FOLDER in deploy.env to the dashboard folder name under /apps/."
          exit 1
        fi

        echo "REMOTE_PATH=/apps/${APP_FOLDER}/" >> "$GITHUB_ENV"

    - name: 📁 Ensure remote dashboard folder exists
      shell: bash
      env:
        SFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq sshpass

        REMOTE_PATH="${{ env.REMOTE_PATH }}"
        REMOTE_PATH="${REMOTE_PATH%/}"

        # A plain `ssh ... "mkdir ..."` is a shell-exec session, which a
        # chrooted/SFTP-only account rejects ("This service allows sftp
        # connections only."). Use a real SFTP session instead; the leading
        # "-" on mkdir tells sftp to ignore an error there (folder already
        # exists) instead of aborting the whole batch.
        printf '%s\n' "-mkdir ${REMOTE_PATH}" "bye" > /tmp/sftp_mkdir_batch.txt

        # -b (batch mode) implies BatchMode=yes on the underlying ssh
        # connection, which disables interactive prompting -- so password
        # auth silently can't happen and sshpass never gets a prompt to
        # answer ("Permission denied (publickey,password)"). Force
        # BatchMode=no back on so password auth still works; -b still
        # avoids sftp's own confirmation prompts for the mkdir command.
        sshpass -p "$SFTP_PASSWORD" sftp \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o BatchMode=no \
          -P 22 \
          -b /tmp/sftp_mkdir_batch.txt \
          "${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }}"

    - name: 📂 Sync files via SFTP
      uses: wlixcc/SFTP-Deploy-Action@v1.2.4
      with:
        username: ${{ secrets.FTP_USERNAME }}
        server: ${{ secrets.FTP_SERVER }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 22
        local_path: './deploy/*'
        remote_path: ${{ env.REMOTE_PATH }}
        sftp_only: true
        delete_remote_files: false
